app = "CHANGE-ME-your-app-name"
primary_region = "iad"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  # fly's default limit is ~25 simultaneous connections, and one web page easily opens more than that
  # (images, scripts, video chunks). Past the limit requests wait in line, which looks like a frozen or blank page.
  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

# 256 MB (the default) runs out of memory on big pages and the machine restarts mid-load
[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
