# fly.toml app configuration file generated for ps5-net on 2026-11-08T06:06:29Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'ps5-net'
primary_region = 'sjc'

[build]
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 250
    soft_limit = 200

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
